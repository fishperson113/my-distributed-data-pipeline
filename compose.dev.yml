name: my-distributed-data-pipeline-elt-dev

# Local compatibility stack: optional Mongo mirroring and a Postgres instance
# for running dbt from the host.
# Independent of compose.yml, which runs Dagster's own Postgres metadata
# database. The two Postgres instances must never share a schema.
# Not used on the VPS; scripts/deploy.sh does not touch this file.

services:
  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD must be set in .env}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - elt-mongo-data:/data/db

  warehouse-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${WAREHOUSE_POSTGRES_USER:-warehouse}
      POSTGRES_PASSWORD: ${WAREHOUSE_POSTGRES_PASSWORD:?WAREHOUSE_POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${WAREHOUSE_POSTGRES_DB:-warehouse}
    ports:
      - "${WAREHOUSE_POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - elt-warehouse-postgres-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro

volumes:
  elt-mongo-data:
  elt-warehouse-postgres-data:
