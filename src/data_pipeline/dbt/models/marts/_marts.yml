version: 2

models:
  - name: exp_vn30_vs_fund_daily
    description: >
      Exploratory intraday join of each stock against the E1VFVN30 fund on a shared
      grid. Every bucket seen on either side is kept; closes are carried forward
      within the trading day and flagged so filled values stay distinguishable.
    columns:
      - name: trade_date
        tests: [not_null]
      - name: bucket_ts
        tests: [not_null]
      - name: stock_symbol
        tests: [not_null]
