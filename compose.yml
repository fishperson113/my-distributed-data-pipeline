name: my-distributed-data-pipeline

x-dagster-environment: &dagster-environment
  DAGSTER_HOME: ${DAGSTER_HOME:-/opt/dagster/dagster_home}
  DAGSTER_CODE_PORT: ${DAGSTER_CODE_PORT:-4000}
  POSTGRES_USER: ${POSTGRES_USER:-dagster}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
  POSTGRES_DB: ${POSTGRES_DB:-dagster}
  POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  VNSTOCK_PROVIDER: ${VNSTOCK_PROVIDER:-kbs}
  VNSTOCK_TELEMETRY: ${VNSTOCK_TELEMETRY:-off}
  SSI_HISTORY_URL: ${SSI_HISTORY_URL:-https://iboard-api.ssi.com.vn/statistics/charts/history}
  SOURCE_HTTP_TIMEOUT_SECONDS: ${SOURCE_HTTP_TIMEOUT_SECONDS:-30}
  SOURCE_HTTP_MAX_ATTEMPTS: ${SOURCE_HTTP_MAX_ATTEMPTS:-3}
  RAW_STORAGE_PATH: ${RAW_STORAGE_PATH:-/opt/dagster/app/storage/raw}

x-dagster-service: &dagster-service
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: my-distributed-data-pipeline:${IMAGE_TAG:-local}
  environment: *dagster-environment
  restart: unless-stopped
  networks:
    - dagster-network

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dagster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-dagster}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    volumes:
      - dagster-postgres-data:/var/lib/postgresql/data
    networks:
      - dagster-network

  dagster-code:
    <<: *dagster-service
    command:
      - dagster
      - api
      - grpc
      - --host
      - 0.0.0.0
      - --port
      - ${DAGSTER_CODE_PORT:-4000}
      - --module-name
      - data_pipeline.definitions
    expose:
      - "${DAGSTER_CODE_PORT:-4000}"
    healthcheck:
      test:
        - CMD
        - dagster
        - api
        - grpc-health-check
        - --host
        - localhost
        - --port
        - "${DAGSTER_CODE_PORT:-4000}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - ./docker/dagster/dagster.yaml:/opt/dagster/dagster_home/dagster.yaml:ro
      - dagster-compute-logs:/opt/dagster/compute_logs

  dagster-webserver:
    <<: *dagster-service
    command:
      - dagster-webserver
      - --host
      - 0.0.0.0
      - --port
      - "3000"
      - --workspace
      - /opt/dagster/app/docker/dagster/workspace.yaml
    depends_on:
      postgres:
        condition: service_healthy
      dagster-code:
        condition: service_healthy
    ports:
      - "${DAGSTER_WEBSERVER_PORT:-3000}:3000"
    volumes:
      - ./docker/dagster/dagster.yaml:/opt/dagster/dagster_home/dagster.yaml:ro
      - dagster-compute-logs:/opt/dagster/compute_logs

  dagster-daemon:
    <<: *dagster-service
    command:
      - dagster-daemon
      - run
      - --workspace
      - /opt/dagster/app/docker/dagster/workspace.yaml
    depends_on:
      postgres:
        condition: service_healthy
      dagster-code:
        condition: service_healthy
    volumes:
      - ./docker/dagster/dagster.yaml:/opt/dagster/dagster_home/dagster.yaml:ro
      - dagster-compute-logs:/opt/dagster/compute_logs

volumes:
  dagster-postgres-data:
  dagster-compute-logs:

networks:
  dagster-network:
    driver: bridge
