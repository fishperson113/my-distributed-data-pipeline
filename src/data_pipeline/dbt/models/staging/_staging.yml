version: 2

models:
  - name: stg_vnstock__stock_daily
    description: Typed, one-row-per-bar view over the vnstock Bronze raw table, at the intraday grain.
    columns:
      - name: symbol
        tests: [not_null]
      - name: bar_ts
        tests: [not_null]
      - name: ts_epoch
        tests: [not_null]
      - name: trade_date
        tests: [not_null]

  - name: stg_ssi__fund_daily
    description: Typed, one-row-per-bar view over the SSI iBoard Bronze raw table, at the intraday grain.
    columns:
      - name: symbol
        tests: [not_null]
      - name: bar_ts
        tests: [not_null]
      - name: ts_epoch
        tests: [not_null]
      - name: trade_date
        tests: [not_null]
